# Development stack: Postgres + API + Vite frontend (hot reload)
# Run: npm run docker:dev   (from this folder)
# Or:  docker compose -f docker-compose.dev.yml up --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mercy
      POSTGRES_PASSWORD: mercy
      POSTGRES_DB: mercy
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercy -d mercy"]
      interval: 5s
      timeout: 5s
      retries: 10

  main-server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - "4000:4000"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://mercy:mercy@postgres:5432/mercy?schema=public
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-you@example.com}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./app
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    env_file:
      - path: ./app/.env
        required: false
    environment:
      VITE_MAIN_SERVER_URL: http://localhost:4000
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      VITE_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    depends_on:
      main-server:
        condition: service_healthy

volumes:
  postgres-data:
