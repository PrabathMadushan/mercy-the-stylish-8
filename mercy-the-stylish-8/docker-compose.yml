version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mercy
      POSTGRES_PASSWORD: mercy
      POSTGRES_DB: mercy
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  main-server:
    build: ./server
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://mercy:mercy@postgres:5432/mercy?schema=public
    depends_on:
      - postgres
    restart: unless-stopped

  ai-server:
    build: ./ai-server
    ports:
      - "4100:4100"
    env_file:
      - ./ai-server/.env
    restart: unless-stopped

  web:
    build: ./app
    ports:
      - "8080:80"
    depends_on:
      - main-server
    restart: unless-stopped

volumes:
  postgres-data:
