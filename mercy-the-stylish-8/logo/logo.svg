<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7F0"/>
      <stop offset="100%" stop-color="#F3D6DE"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E4C468"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="64" fill="url(#bg)"/>

  <!-- Ribbon monogram M, drawn as one continuous stroke like a dress hemline -->
  <path d="M 130 360
           C 130 220, 150 150, 180 150
           C 205 150, 210 230, 210 280
           C 210 230, 235 150, 256 150
           C 277 150, 302 230, 302 280
           C 302 230, 307 150, 332 150
           C 362 150, 382 220, 382 360"
        fill="none" stroke="#C93B6B" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- gold thread accent looping under the M, evoking a needle & thread -->
  <path d="M 120 380 Q 256 420 392 380" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="120" cy="380" r="7" fill="url(#gold)"/>
  <circle cx="392" cy="380" r="7" fill="url(#gold)"/>

  <text x="256" y="440" font-family="Georgia, 'Playfair Display', serif" font-size="40" font-style="italic"
        fill="#5B2A3A" text-anchor="middle">Mercy</text>
  <text x="256" y="470" font-family="Helvetica, Arial, sans-serif" font-size="16" letter-spacing="4"
        fill="#C9A227" text-anchor="middle">THE STYLISH</text>
</svg>
